version: '3.8'

services:
  car-rental-service:
    build:
      context: ./car-rental-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=car-rental-service
    networks:
      - rental-network

  hello-service:
    build:
      context: ./hello-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=hello-service
    networks:
      - rental-network

networks:
  rental-network:
    driver: bridge
